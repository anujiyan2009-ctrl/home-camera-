<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Anu Home CCTV</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#02050a;color:#fff;font-family:Arial,sans-serif}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
.login{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 position:relative;overflow:hidden;background:#02050a;padding:20px
}
.matrix{position:absolute;inset:0;overflow:hidden;opacity:.2}
.num{
 position:absolute;top:-500px;color:#20a8ff;font:14px monospace;
 line-height:22px;text-shadow:0 0 8px #168fff;
 animation:fall linear infinite
}
@keyframes fall{to{transform:translateY(120vh)}}

.glow1,.glow2{position:absolute;border-radius:50%;filter:blur(110px);opacity:.2}
.glow1{width:400px;height:400px;background:#087cff;left:-160px;top:-120px}
.glow2{width:400px;height:400px;background:#702cff;right:-160px;bottom:-140px}

.card{
 position:relative;z-index:5;width:100%;max-width:410px;padding:35px 27px;
 text-align:center;border:1px solid #ffffff22;border-radius:28px;
 background:#07101dcc;backdrop-filter:blur(25px);
 box-shadow:0 30px 80px #000b;animation:appear .7s ease
}
@keyframes appear{from{opacity:0;transform:translateY(30px) scale(.96)}
to{opacity:1;transform:none}}

.cctv{font-size:70px;margin-bottom:8px}
.card h1{margin:0;font-size:29px;letter-spacing:2px}
.sub{color:#8996aa;margin:9px 0 28px}

.pass{width:100%;height:55px;padding:0 16px;border-radius:15px;
 border:1px solid #ffffff22;background:#0008;color:white;font-size:16px;outline:0}
.pass:focus{border-color:#329dff;box-shadow:0 0 20px #168fff33}

.loginBtn{
 width:100%;height:55px;margin-top:18px;border:0;border-radius:15px;
 background:linear-gradient(135deg,#fff,#dce8f8);color:#07101e;
 font-weight:bold;font-size:16px
}
#error{height:22px;margin-top:12px;color:#ff6577;font-size:14px}
.created{margin-top:20px;color:#718096;font-size:12px;letter-spacing:1px}
.created b{color:#4da6ff}

/* DASHBOARD */
.dashboard{min-height:100vh;background:#000}
.topbar{
 height:62px;padding:0 16px;display:flex;align-items:center;
 justify-content:space-between;background:#07101a;border-bottom:1px solid #ffffff12
}
.title{font-size:19px;font-weight:bold}
.logout{border:1px solid #ffffff22;background:#101b27;color:white;border-radius:10px;padding:9px 13px}

.cameras{
 display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px
}
.camera{
 position:relative;background:#050505;border:1px solid #ffffff12;
 border-radius:15px;overflow:hidden;min-height:260px
}
.camera:last-child{grid-column:1/-1;min-height:330px}

.video{
 width:100%;height:100%;min-height:260px;display:block;object-fit:cover;background:#000
}
.camera:last-child .video{min-height:330px}

.overlay{
 position:absolute;inset:0;pointer-events:none
}
.label{
 position:absolute;left:10px;top:10px;z-index:3;
 padding:7px 10px;border-radius:9px;background:#000b;
 font-size:12px;font-weight:bold
}
.status{
 position:absolute;right:10px;top:10px;z-index:3;
 padding:7px 10px;border-radius:9px;background:#000b;font-size:12px
}
.status.live{color:#00ff70}
.status.off{color:#ff6474}

.controls{
 position:absolute;left:0;right:0;bottom:0;z-index:5;
 padding:12px;background:linear-gradient(transparent,#000d);
 display:flex;gap:8px
}
.camBtn,.fullBtn{
 border:1px solid #ffffff22;background:#000b;color:white;
 border-radius:10px;padding:9px 12px
}
.fullBtn{margin-left:auto;font-size:18px}

.info{
 padding:10px;background:#07101a;border-top:1px solid #ffffff0d;
 display:flex;justify-content:space-between;font-size:13px;color:#aab6c8
}
.count{color:#00ff70;font-weight:bold}

.gallery{
 padding:15px;background:#060b11;border-top:1px solid #ffffff10
}
.gallery h2{font-size:17px;margin:0 0 12px}
.photos{display:flex;gap:10px;overflow-x:auto}
.photos img{width:120px;height:80px;object-fit:cover;border-radius:9px;border:1px solid #ffffff22}

/* fullscreen */
.fullscreen{
 position:fixed!important;inset:0!important;width:100vw!important;
 height:100vh!important;z-index:99999!important;border-radius:0!important
}
.fullscreen .video{width:100vw;height:100vh;min-height:100vh;object-fit:contain}
.fullscreen .overlay{width:100vw;height:100vh}

@media(max-width:600px){
 .cameras{grid-template-columns:1fr}
 .camera,.camera:last-child{grid-column:auto;min-height:300px}
 .video,.camera:last-child .video{min-height:300px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage" class="login">
 <div class="glow1"></div>
 <div class="glow2"></div>
 <div id="matrix" class="matrix"></div>

 <div class="card">
   <div class="cctv">📹</div>
   <h1>HOME CCTV</h1>
   <div class="sub">Secure Security Dashboard</div>

   <input id="password" class="pass" type="password"
          placeholder="Enter security password">

   <button id="loginBtn" class="loginBtn">🔓 Unlock Dashboard</button>

   <div id="error"></div>
   <div class="created">Created by <b>Anu</b></div>
 </div>
</section>


<!-- DASHBOARD -->
<section id="dashboard" class="dashboard hidden">

 <div class="topbar">
   <div class="title">📹 ANU HOME CCTV</div>
   <button id="logout" class="logout">Logout</button>
 </div>

 <div class="cameras">

   <!-- CAMERA 1 -->
   <div class="camera" id="cameraBox1">
     <div class="label">CAMERA 1</div>
     <div class="status off" id="status1">OFFLINE</div>
     <video id="video1" class="video" autoplay muted playsinline></video>
     <canvas id="canvas1" class="overlay"></canvas>

     <div class="controls">
       <button class="camBtn" onclick="startCamera(1)">📹 Start</button>
       <button class="camBtn" onclick="stopCamera(1)">⏹ Stop</button>
       <button class="fullBtn" onclick="fullCamera(1)">⛶</button>
     </div>

     <div class="info">
       <span>Persons detected</span>
       <span class="count" id="count1">0</span>
     </div>
   </div>


   <!-- CAMERA 2 -->
   <div class="camera" id="cameraBox2">
     <div class="label">CAMERA 2</div>
     <div class="status off" id="status2">OFFLINE</div>
     <video id="video2" class="video" autoplay muted playsinline></video>
     <canvas id="canvas2" class="overlay"></canvas>

     <div class="controls">
       <button class="camBtn" onclick="startCamera(2)">📹 Start</button>
       <button class="camBtn" onclick="stopCamera(2)">⏹ Stop</button>
       <button class="fullBtn" onclick="fullCamera(2)">⛶</button>
     </div>

     <div class="info">
       <span>Persons detected</span>
       <span class="count" id="count2">0</span>
     </div>
   </div>


   <!-- CAMERA 3 -->
   <div class="camera" id="cameraBox3">
     <div class="label">CAMERA 3</div>
     <div class="status off" id="status3">OFFLINE</div>
     <video id="video3" class="video" autoplay muted playsinline></video>
     <canvas id="canvas3" class="overlay"></canvas>

     <div class="controls">
       <button class="camBtn" onclick="startCamera(3)">📹 Start</button>
       <button class="camBtn" onclick="stopCamera(3)">⏹ Stop</button>
       <button class="fullBtn" onclick="fullCamera(3)">⛶</button>
     </div>

     <div class="info">
       <span>Persons detected</span>
       <span class="count" id="count3">0</span>
     </div>
   </div>

 </div>


 <!-- CAPTURED PHOTOS -->
 <div class="gallery">
   <h2>📸 Captured Persons</h2>
   <div id="photos" class="photos"></div>
 </div>

</section>


<script>

/* =========================
   LOGIN
========================= */

const PASSWORD = "ANU1234@";

const loginPage = document.getElementById("loginPage");
const dashboard = document.getElementById("dashboard");
const password = document.getElementById("password");
const error = document.getElementById("error");

document.getElementById("loginBtn").onclick = login;

password.addEventListener("keydown", e => {
 if(e.key === "Enter") login();
});

function login(){
 if(password.value === PASSWORD){
   error.textContent = "";
   loginPage.classList.add("hidden");
   dashboard.classList.remove("hidden");
 }else{
   error.textContent = "❌ Incorrect password";
 }
}

document.getElementById("logout").onclick = () => {
 stopCamera(1);
 stopCamera(2);
 stopCamera(3);
 dashboard.classList.add("hidden");
 loginPage.classList.remove("hidden");
 password.value = "";
};


/* =========================
   MATRIX 0 / 1
========================= */

const matrix = document.getElementById("matrix");

for(let i=0;i<45;i++){
 const d=document.createElement("div");
 d.className="num";
 d.style.left=Math.random()*100+"%";
 d.style.animationDuration=(4+Math.random()*8)+"s";
 d.style.animationDelay=(-Math.random()*10)+"s";

 let s="";
 for(let j=0;j<35;j++){
   s += Math.random()>.5 ? "1<br>" : "0<br>";
 }
 d.innerHTML=s;
 matrix.appendChild(d);
}


/* =========================
   MODEL
========================= */

let model = null;
let modelLoading = false;

async function loadModel(){

 if(model) return true;
 if(modelLoading) return false;

 modelLoading = true;

 try{
   model = await cocoSsd.load();
   console.log("Person detection model loaded");
   return true;
 }catch(e){
   console.error(e);
   alert("Person detection model could not load. Check internet.");
   return false;
 }finally{
   modelLoading=false;
 }
}


/* =========================
   CAMERA STORAGE
========================= */

const streams = {
 1:null,
 2:null,
 3:null
};

const timers = {
 1:null,
 2:null,
 3:null
};

const lastCapture = {
 1:0,
 2:0,
 3:0
};


/* =========================
   START CAMERA
========================= */

async function startCamera(id){

 const ok = await loadModel();
 if(!ok) return;

 if(streams[id]) return;

 try{

   const stream =
     await navigator.mediaDevices.getUserMedia({
       video:{
         facingMode:"environment",
         width:{ideal:1280},
         height:{ideal:720}
       },
       audio:false
     });

   streams[id]=stream;

   const video=document.getElementById("video"+id);
   const status=document.getElementById("status"+id);

   video.srcObject=stream;
   await video.play();

   status.textContent="● LIVE";
   status.className="status live";

   video.onloadedmetadata=()=>{

     const canvas=document.getElementById("canvas"+id);

     canvas.width=video.videoWidth;
     canvas.height=video.videoHeight;

     runDetection(id);
   };

 }catch(e){

   console.error(e);

   alert(
     "Camera "+id+" could not start.\n\n"+
     "Allow camera permission in Chrome."
   );
 }
}


/* =========================
   STOP CAMERA
========================= */

function stopCamera(id){

 if(streams[id]){
   streams[id].getTracks().forEach(t=>t.stop());
   streams[id]=null;
 }

 if(timers[id]){
   clearTimeout(timers[id]);
   timers[id]=null;
 }

 const video=document.getElementById("video"+id);
 const canvas=document.getElementById("canvas"+id);

 video.srcObject=null;

 const ctx=canvas.getContext("2d");
 ctx.clearRect(0,0,canvas.width,canvas.height);

 document.getElementById("status"+id).textContent="OFFLINE";
 document.getElementById("status"+id).className="status off";
 document.getElementById("count"+id).textContent="0";
}


/* =========================
   PERSON DETECTION
========================= */

async function runDetection(id){

 if(!streams[id]) return;

 const video=document.getElementById("video"+id);
 const canvas=document.getElementById("canvas"+id);
 const ctx=canvas.getContext("2d");

 if(
   video.readyState < 2 ||
   !video.videoWidth ||
   !video.videoHeight
 ){
   timers[id]=setTimeout(()=>runDetection(id),300);
   return;
 }

 try{

   const predictions =
     await model.detect(video);

   const persons =
     predictions.filter(
       p => p.class === "person" && p.score >= 0.55
     );

   document.getElementById("count"+id).textContent =
     persons.length;

   ctx.clearRect(
     0,0,
     canvas.width,
     canvas.height
   );

   const sx=canvas.width/video.videoWidth;
   const sy=canvas.height/video.videoHeight;

   persons.forEach((p,index)=>{

     const x=p.bbox[0]*sx;
     const y=p.bbox[1]*sy;
     const w=p.bbox[2]*sx;
     const h=p.bbox[3]*sy;

     /* GREEN FULL BODY BOX */
     ctx.strokeStyle="#00ff66";
     ctx.lineWidth=4;
     ctx.shadowColor="#00ff66";
     ctx.shadowBlur=10;

     ctx.strokeRect(x,y,w,h);

     ctx.shadowBlur=0;

     /* LABEL */
     ctx.font="bold 16px Arial";

     const text =
       "PERSON " +
       Math.round(p.score*100) +
       "%";

     const tw=ctx.measureText(text).width;

     ctx.fillStyle="#00ff66";
     ctx.fillRect(
       x,
       Math.max(0,y-25),
       tw+14,
       25
     );

     ctx.fillStyle="#001b0a";
     ctx.fillText(
       text,
       x+7,
       Math.max(17,y-7)
     );
   });


   /*
      Automatic snapshot.
      One capture per camera every 5 seconds
      while a person is detected.
   */

   if(persons.length > 0){

     const now=Date.now();

     if(now-lastCapture[id] > 5000){

       capturePersonPhoto(
         video,
         id
       );

       lastCapture[id]=now;
     }
   }

 }catch(e){
   console.error("Detection error:",e);
 }

 timers[id]=setTimeout(
   ()=>runDetection(id),
   250
 );
}


/* =========================
   CAPTURE PHOTO
========================= */

function capturePersonPhoto(video,id){

 const c=document.createElement("canvas");

 c.width=video.videoWidth;
 c.height=video.videoHeight;

 const ctx=c.getContext("2d");

 ctx.drawImage(
   video,
   0,0,
   c.width,
   c.height
 );

 const image =
   c.toDataURL("image/jpeg",0.85);

 const img=document.createElement("img");

 img.src=image;
 img.title="Camera "+id+" - "+new Date().toLocaleTimeString();

 document.getElementById("photos")
   .prepend(img);

 /* Keep last 20 photos */
 const photos =
   document.getElementById("photos");

 while(photos.children.length>20){
   photos.removeChild(
     photos.lastElementChild
   );
 }
}


/* =========================
   FULLSCREEN
========================= */

async function fullCamera(id){

 const box =
   document.getElementById("cameraBox"+id);

 try{

   if(
     document.fullscreenElement ||
     document.webkitFullscreenElement
   ){

     if(document.exitFullscreen)
       await document.exitFullscreen();

     else if(document.webkitExitFullscreen)
       document.webkitExitFullscreen();

     box.classList.remove("fullscreen");

   }else{

     box.classList.add("fullscreen");

     if(box.requestFullscreen)
       await box.requestFullscreen();

     else if(box.webkitRequestFullscreen)
       box.webkitRequestFullscreen();
   }

 }catch(e){

   box.classList.toggle("fullscreen");

 }
}


/* =========================
   CLEANUP
========================= */

window.addEventListener(
 "beforeunload",
 ()=>{
   stopCamera(1);
   stopCamera(2);
   stopCamera(3);
 }
);

</script>
</body>
</html>
