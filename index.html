<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Air Canvas on iPad</title>
  <style>
    body { margin:0; background:#000; }
    #video { display:none; }
    #canvas { position:fixed; top:0; left:0; width:100vw; height:100vh; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('video');

    // Setup canvas size
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    let drawing = false;
    let lastX = null, lastY = null;

    // MediaPipe Hands setup
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      // Clear only when no hand
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        drawing = false;
        lastX = null;
        lastY = null;
        return;
      }

      const landmarks = results.multiHandLandmarks[0];
      // Index finger tip = landmark 8
      const x = (1 - landmarks[8].x) * canvas.width;  // mirror effect
      const y = landmarks[8].y * canvas.height;

      // Black background
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw lines from previous point
      if (lastX !== null && drawing) {
        ctx.strokeStyle = 'lime';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
      }

      lastX = x;
      lastY = y;
      drawing = true;
    });

    // Start camera
    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 1280,
      height: 720
    });
    camera.start();
  </script>
</body>
</html>
