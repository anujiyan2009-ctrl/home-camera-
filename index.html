<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home CCTV Security</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: #02060b;
  overflow-x: hidden;
}

/* =========================
   ANIMATED BACKGROUND
   ========================= */

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}

.orb-blue {
  position: absolute;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  background: #087cff;
  filter: blur(100px);
  opacity: .20;
  top: -150px;
  left: -120px;
  animation: blueMove 10s ease-in-out infinite alternate;
}

@keyframes blueMove {
  0% { transform: translate(0,0) scale(1); }
  50% { transform: translate(100px,80px) scale(1.25); }
  100% { transform: translate(30px,160px) scale(.9); }
}

.orb-purple {
  position: absolute;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  background: #7b2cff;
  filter: blur(100px);
  opacity: .18;
  right: -140px;
  bottom: -140px;
  animation: purpleMove 12s ease-in-out infinite alternate;
}

@keyframes purpleMove {
  0% { transform: translate(0,0) scale(1); }
  50% { transform: translate(-100px,-80px) scale(1.3); }
  100% { transform: translate(-40px,-160px) scale(.9); }
}

/* =========================
   0 / 1 MATRIX
   ========================= */

.binary-bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
  z-index: 1;
  opacity: .22;
}

.binary-column {
  position: absolute;
  top: -600px;
  color: #20a8ff;
  font-family: monospace;
  font-size: 14px;
  line-height: 22px;
  white-space: nowrap;

  text-shadow:
    0 0 8px rgba(32,168,255,.8),
    0 0 15px rgba(32,168,255,.35);

  animation: binaryFall linear infinite;
}

@keyframes binaryFall {
  0% {
    transform: translateY(-600px);
  }

  100% {
    transform: translateY(120vh);
  }
}

/* =========================
   MOVING GRID
   ========================= */

.grid {
  position: absolute;
  inset: -100px;
  z-index: 2;

  background-image:
    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px
    );

  background-size: 45px 45px;

  animation: gridMove 12s linear infinite;
}

@keyframes gridMove {
  from {
    transform: translate(0,0);
  }

  to {
    transform: translate(45px,45px);
  }
}

/* SCAN LINE */

.scan-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 2px;
  z-index: 3;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(60,170,255,.8),
      transparent
    );

  box-shadow:
    0 0 25px rgba(60,170,255,.7);

  animation: scanMove 7s linear infinite;
}

@keyframes scanMove {
  0% {
    top: -5px;
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  90% {
    opacity: 1;
  }

  100% {
    top: 100%;
    opacity: 0;
  }
}

/* =========================
   LOGIN PAGE
   ========================= */

.login-page {
  position: relative;
  z-index: 10;

  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.login-card {
  position: relative;
  z-index: 20;

  width: 100%;
  max-width: 410px;

  padding: 38px 28px;

  border-radius: 28px;

  background: rgba(5,12,22,.72);

  border:
    1px solid rgba(255,255,255,.16);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  box-shadow:
    0 30px 80px rgba(0,0,0,.7),
    inset 0 1px rgba(255,255,255,.12);

  text-align: center;

  animation: cardIn .8s ease;
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(35px) scale(.95);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* =========================
   PROFESSIONAL CCTV ICON
   ========================= */

.cctv-icon {
  position: relative;

  width: 96px;
  height: 76px;

  margin: 0 auto 22px;

  animation: cameraFloat 3s ease-in-out infinite;
}

@keyframes cameraFloat {
  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-5px);
  }
}

/* Camera body */

.camera-body {
  position: absolute;

  left: 8px;
  top: 18px;

  width: 70px;
  height: 43px;

  border-radius: 12px;

  background:
    linear-gradient(
      145deg,
      #29394c,
      #0c1521
    );

  border:
    1px solid rgba(100,180,255,.55);

  box-shadow:
    0 0 22px rgba(30,150,255,.35),
    inset 0 1px rgba(255,255,255,.15);
}

/* Camera lens */

.camera-lens {
  position: absolute;

  right: -16px;
  top: 8px;

  width: 32px;
  height: 28px;

  border-radius: 8px;

  background:
    linear-gradient(
      145deg,
      #17283b,
      #050b12
    );

  border:
    1px solid rgba(100,180,255,.65);

  box-shadow:
    0 0 15px rgba(30,150,255,.35);
}

.camera-lens::after {
  content: "";

  position: absolute;

  width: 12px;
  height: 12px;

  top: 7px;
  left: 8px;

  border-radius: 50%;

  background: #06111d;

  border:
    2px solid #3da8ff;

  box-shadow:
    0 0 12px #168fff;
}

/* Camera red status light */

.camera-light {
  position: absolute;

  left: 17px;
  top: 10px;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #ff3b5c;

  box-shadow:
    0 0 10px #ff3b5c;

  animation:
    cameraBlink 1.5s infinite;
}

@keyframes cameraBlink {
  0%,45% {
    opacity: 1;
  }

  50%,100% {
    opacity: .25;
  }
}

/* Camera mounting arm */

.camera-arm {
  position: absolute;

  left: 27px;
  bottom: 4px;

  width: 8px;
  height: 20px;

  border-radius: 5px;

  background: #26384c;

  border:
    1px solid rgba(100,180,255,.35);
}

/* Camera base */

.camera-base {
  position: absolute;

  left: 15px;
  bottom: 0;

  width: 36px;
  height: 7px;

  border-radius: 6px;

  background: #172536;

  border:
    1px solid rgba(100,180,255,.35);
}

/* =========================
   LOGIN TEXT
   ========================= */

.login-card h1 {
  margin: 0;

  font-size: 29px;

  letter-spacing: 2px;
}

.subtitle {
  color: #8996aa;

  margin:
    9px 0 28px;
}

/* PASSWORD */

.password-box {
  position: relative;
}

.password-box input {
  width: 100%;

  padding:
    17px 52px 17px 17px;

  border-radius: 15px;

  border:
    1px solid rgba(255,255,255,.13);

  outline: none;

  background:
    rgba(0,0,0,.38);

  color: white;

  font-size: 16px;

  transition: .25s;
}

.password-box input:focus {
  border-color:
    rgba(80,160,255,.8);

  box-shadow:
    0 0 20px
    rgba(30,130,255,.18);
}

.password-box input::placeholder {
  color: #68758a;
}

.show-password {
  position: absolute;

  right: 15px;
  top: 50%;

  transform:
    translateY(-50%);

  border: 0;

  background: transparent;

  color: #aab6c8;

  font-size: 20px;

  cursor: pointer;
}

/* LOGIN BUTTON */

.login-button {
  width: 100%;

  margin-top: 18px;

  padding: 16px;

  border: 0;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #dce8f8
    );

  color: #07101e;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

  transition:
    transform .2s,
    box-shadow .2s;
}

.login-button:hover {
  transform:
    translateY(-2px);

  box-shadow:
    0 15px 35px
    rgba(0,0,0,.5);
}

.login-button:active {
  transform:
    scale(.97);
}

/* ERROR */

#error {
  min-height: 22px;

  margin-top: 15px;

  color: #ff7070;

  font-size: 14px;
}

.shake {
  animation: shake .35s;
}

@keyframes shake {
  0%,100% {
    transform: translateX(0);
  }

  25% {
    transform: translateX(-8px);
  }

  50% {
    transform: translateX(8px);
  }

  75% {
    transform: translateX(-5px);
  }
}

/* CREATED BY */

.security {
  margin-top: 22px;

  color: #65748a;

  font-size: 12px;
}

.created-by {
  margin-top: 12px;

  color: #718096;

  font-size: 12px;

  letter-spacing: 1px;
}

.created-by span {
  color: #4da6ff;

  font-weight: bold;

  text-shadow:
    0 0 10px
    rgba(77,166,255,.6);
}

/* =========================
   DASHBOARD
   ========================= */

.hidden {
  display: none !important;
}

.dashboard {
  position: relative;

  z-index: 10;

  min-height: 100vh;

  animation:
    dashboardIn .7s ease;
}

@keyframes dashboardIn {
  from {
    opacity: 0;
    transform: scale(.98);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.header {
  position: relative;

  z-index: 20;

  padding:
    23px 18px;

  text-align: center;

  background:
    rgba(3,9,17,.82);

  border-bottom:
    1px solid rgba(255,255,255,.08);

  backdrop-filter:
    blur(20px);
}

.header h1 {
  margin: 0;

  font-size: 25px;

  letter-spacing: 1px;
}

.header p {
  margin:
    7px 0 0;

  color: #8794a8;
}

.container {
  position: relative;

  z-index: 20;

  width: 100%;

  max-width: 950px;

  margin: auto;

  padding: 18px;
}

/* CAMERA */

.camera-card,
.status-card {
  padding: 14px;

  margin-bottom: 16px;

  border-radius: 22px;

  background:
    rgba(5,12,22,.72);

  border:
    1px solid rgba(255,255,255,.10);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.35);
}

.camera-screen {
  min-height: 330px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 16px;

  background:
    linear-gradient(
      135deg,
      rgba(20,30,45,.8),
      rgba(2,5,10,.98)
    );

  text-align: center;

  position: relative;

  overflow: hidden;
}

.camera-screen::before {
  content: "";

  position: absolute;

  width: 100%;

  height: 2px;

  background:
    rgba(70,160,255,.35);

  box-shadow:
    0 0 20px
    rgba(70,160,255,.4);

  animation:
    cameraScan 4s linear infinite;
}

@keyframes cameraScan {
  from {
    top: 0;
  }

  to {
    top: 100%;
  }
}

.camera-icon {
  font-size: 58px;
}

.camera-title {
  margin-top: 10px;

  font-size: 18px;
}

.camera-subtitle {
  color: #69778b;

  margin-top: 6px;
}

.online {
  color: #3ee58b;

  font-size: 14px;
}

.status-card strong {
  display: block;

  font-size: 17px;

  margin-bottom: 8px;
}

.status-row {
  display: flex;

  justify-content: space-between;

  padding: 8px 0;

  color: #aab6c8;
}

.logout {
  width: 100%;

  padding: 15px;

  border-radius: 15px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.06);

  color: white;

  font-size: 15px;

  cursor: pointer;
}

.logout:active {
  transform: scale(.98);
}

/* MOBILE */

@media (max-width: 600px) {

  .login-card {
    padding: 32px 22px;
  }

  .camera-screen {
    min-height: 260px;
  }

}
</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="background">

  <div class="orb-blue"></div>

  <div class="orb-purple"></div>

  <div
    class="binary-bg"
    id="binaryBg">
  </div>

  <div class="grid"></div>

  <div class="scan-line"></div>

</div>


<!-- =========================
     LOGIN
     ========================= -->

<div
  id="loginPage"
  class="login-page">

  <div
    id="loginCard"
    class="login-card">

    <!-- PROFESSIONAL CCTV CAMERA ICON -->

    <div class="cctv-icon">

      <div class="camera-body">

        <div class="camera-light"></div>

      </div>

      <div class="camera-lens"></div>

      <div class="camera-arm"></div>

      <div class="camera-base"></div>

    </div>


    <h1>
      HOME CCTV
    </h1>

    <p class="subtitle">
      Secure Security Dashboard
    </p>


    <!-- PASSWORD -->

    <div class="password-box">

      <input
        id="password"
        type="password"
        placeholder="Enter security password"
        autocomplete="off"
      >

      <button
        class="show-password"
        type="button"
        onclick="togglePassword()"
        id="eyeButton">

        👁️

      </button>

    </div>


    <!-- LOGIN BUTTON -->

    <button
      class="login-button"
      onclick="login()">

      🔓 Unlock Dashboard

    </button>


    <div id="error"></div>


    <div class="security">
      🔒 HOME SECURITY SYSTEM
    </div>


    <div class="created-by">
      Created by <span>Anu</span>
    </div>

  </div>

</div>


<!-- =========================
     DASHBOARD
     ========================= -->

<div
  id="dashboard"
  class="dashboard hidden">

  <div class="header">

    <h1>
      🏠 HOME CCTV
    </h1>

    <p>
      Security Camera Dashboard
    </p>

  </div>


  <div class="container">

    <div class="camera-card">

      <div class="camera-screen">

        <div>

          <div class="camera-icon">
            📹
          </div>

          <div class="camera-title">
            Camera Offline
          </div>

          <div class="camera-subtitle">
            Waiting for CCTV connection...
          </div>

        </div>

      </div>

      <p class="online">
        ● SYSTEM READY
      </p>

    </div>


    <div class="status-card">

      <strong>
        👤 Face Detection
      </strong>

      <div class="status-row">

        <span>
          Status
        </span>

        <span id="faceStatus">
          No face detected
        </span>

      </div>

      <div class="status-row">

        <span>
          Face Count
        </span>

        <span id="faceCount">
          0
        </span>

      </div>

    </div>


    <div class="status-card">

      <strong>
        🕐 System Time
      </strong>

      <div id="time">
        --:--:--
      </div>

    </div>


    <button
      class="logout"
      onclick="logout()">

      🔒 Lock Dashboard

    </button>

  </div>

</div>


<script>

/* =========================
   0 / 1 MATRIX GENERATOR
   ========================= */

const binaryBg =
  document.getElementById("binaryBg");

for (let i = 0; i < 40; i++) {

  const column =
    document.createElement("div");

  column.className =
    "binary-column";

  column.style.left =
    Math.random() * 100 + "%";

  column.style.animationDuration =
    (4 + Math.random() * 8) + "s";

  column.style.animationDelay =
    (-Math.random() * 10) + "s";

  column.style.opacity =
    (0.25 + Math.random() * 0.75);

  column.style.fontSize =
    (11 + Math.random() * 7) + "px";

  let text = "";

  for (let j = 0; j < 35; j++) {

    text +=
      Math.random() > .5
      ? "1<br>"
      : "0<br>";

  }

  column.innerHTML = text;

  binaryBg.appendChild(column);
}


/* =========================
   PASSWORD
   ========================= */

const PASSWORD =
  "ANU12345@";


/* LOGIN */

function login() {

  const input =
    document.getElementById("password");

  const card =
    document.getElementById("loginCard");

  const error =
    document.getElementById("error");

  if (input.value === PASSWORD) {

    error.textContent = "";

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("dashboard")
      .classList.remove("hidden");

  } else {

    error.textContent =
      "❌ Incorrect password";

    card.classList.remove("shake");

    void card.offsetWidth;

    card.classList.add("shake");

  }
}


/* SHOW / HIDE PASSWORD */

function togglePassword() {

  const input =
    document.getElementById("password");

  const button =
    document.getElementById("eyeButton");

  if (input.type === "password") {

    input.type = "text";

    button.textContent =
      "🙈";

  } else {

    input.type = "password";

    button.textContent =
      "👁️";

  }
}


/* ENTER KEY */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        login();
      }

    }
  );


/* LOGOUT */

function logout() {

  document
    .getElementById("dashboard")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("password")
    .value = "";

}


/* CLOCK */

function updateTime() {

  document
    .getElementById("time")
    .textContent =
      new Date()
      .toLocaleTimeString();

}

updateTime();

setInterval(
  updateTime,
  1000
);

</script>

</body>
</html>
