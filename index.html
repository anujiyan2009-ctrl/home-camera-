<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#000000">

<title>Home CCTV</title>

<style>

/* =========================
   BASIC
========================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

.hidden {
  display: none !important;
}


/* =====================================================
   LOGIN
===================================================== */

.login-page {
  position: relative;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  overflow: hidden;

  background: #02060b;
}

.login-background {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}


/* BLUE GLOW */

.blue-glow {
  position: absolute;

  width: 400px;
  height: 400px;

  left: -150px;
  top: -120px;

  border-radius: 50%;

  background: #087cff;

  filter: blur(110px);

  opacity: .23;

  animation:
    blueMove 10s ease-in-out infinite alternate;
}

@keyframes blueMove {

  from {
    transform: translate(0,0) scale(1);
  }

  to {
    transform: translate(170px,150px) scale(1.25);
  }

}


/* PURPLE GLOW */

.purple-glow {
  position: absolute;

  width: 400px;
  height: 400px;

  right: -150px;
  bottom: -150px;

  border-radius: 50%;

  background: #762cff;

  filter: blur(110px);

  opacity: .18;

  animation:
    purpleMove 12s ease-in-out infinite alternate;
}

@keyframes purpleMove {

  from {
    transform: translate(0,0) scale(1);
  }

  to {
    transform: translate(-150px,-130px) scale(1.25);
  }

}


/* 0 / 1 */

.matrix {
  position: absolute;
  inset: 0;

  overflow: hidden;

  opacity: .22;
}

.matrix-column {
  position: absolute;

  top: -600px;

  color: #21a9ff;

  font-family: monospace;

  font-size: 14px;

  line-height: 22px;

  white-space: nowrap;

  text-shadow:
    0 0 8px #168fff;

  animation:
    matrixFall linear infinite;
}

@keyframes matrixFall {

  from {
    transform: translateY(-600px);
  }

  to {
    transform: translateY(120vh);
  }

}


/* GRID */

.login-grid {
  position: absolute;
  inset: -100px;

  background-image:

    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px
    );

  background-size: 45px 45px;

  animation:
    gridMove 12s linear infinite;
}

@keyframes gridMove {

  from {
    transform: translate(0,0);
  }

  to {
    transform: translate(45px,45px);
  }

}


/* SCAN */

.login-scan {
  position: absolute;

  left: 0;
  right: 0;

  top: -5px;

  height: 2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #3faaff,
      transparent
    );

  box-shadow:
    0 0 25px #168fff;

  animation:
    scanMove 7s linear infinite;
}

@keyframes scanMove {

  0% {
    top: -5px;
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  90% {
    opacity: 1;
  }

  100% {
    top: 100%;
    opacity: 0;
  }

}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card {
  position: relative;

  z-index: 10;

  width: 100%;
  max-width: 410px;

  padding: 35px 27px;

  border-radius: 28px;

  background:
    rgba(5,12,22,.78);

  border:
    1px solid
    rgba(255,255,255,.16);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  box-shadow:
    0 30px 80px rgba(0,0,0,.7);

  text-align: center;

  animation:
    cardAppear .7s ease;
}

@keyframes cardAppear {

  from {
    opacity: 0;

    transform:
      translateY(35px)
      scale(.95);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }

}


/* =====================================================
   CCTV ICON
===================================================== */

.cctv-icon {
  position: relative;

  width: 105px;
  height: 90px;

  margin:
    0 auto 15px;
}

.camera-body {
  position: absolute;

  left: 5px;
  top: 23px;

  width: 70px;
  height: 43px;

  border-radius: 12px;

  background:
    linear-gradient(
      145deg,
      #33475c,
      #0b1420
    );

  border:
    1px solid
    rgba(90,180,255,.65);

  box-shadow:
    0 0 25px
    rgba(30,150,255,.4);
}

.camera-lens {
  position: absolute;

  left: 70px;
  top: 29px;

  width: 32px;
  height: 29px;

  border-radius: 8px;

  background: #03080e;

  border:
    1px solid
    rgba(80,170,255,.7);
}

.camera-lens::after {
  content: "";

  position: absolute;

  left: 8px;
  top: 7px;

  width: 12px;
  height: 12px;

  border-radius: 50%;

  background: #020912;

  border:
    2px solid #42adff;

  box-shadow:
    0 0 12px #168fff;
}

.camera-light {
  position: absolute;

  left: 14px;
  top: 10px;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #ff3658;

  box-shadow:
    0 0 12px #ff3658;

  animation:
    cameraBlink 1.5s infinite;
}

@keyframes cameraBlink {

  0%,
  45% {
    opacity: 1;
  }

  50%,
  100% {
    opacity: .25;
  }

}

.camera-arm {
  position: absolute;

  left: 28px;
  top: 65px;

  width: 8px;
  height: 20px;

  border-radius: 5px;

  background: #24384c;
}

.camera-base {
  position: absolute;

  left: 15px;
  top: 83px;

  width: 36px;
  height: 7px;

  border-radius: 6px;

  background: #172536;
}


/* =====================================================
   LOGIN TEXT
===================================================== */

.login-card h1 {
  margin: 0;

  font-size: 29px;

  letter-spacing: 2px;
}

.subtitle {
  margin:
    9px 0 28px;

  color: #8996aa;
}


/* PASSWORD */

.password-box {
  position: relative;
  width: 100%;
}

.password-box input {
  width: 100%;

  height: 55px;

  padding:
    0 52px 0 17px;

  border-radius: 15px;

  border:
    1px solid
    rgba(255,255,255,.14);

  outline: none;

  background:
    rgba(0,0,0,.38);

  color: white;

  font-size: 16px;
}

.password-box input:focus {
  border-color: #329dff;

  box-shadow:
    0 0 20px
    rgba(30,130,255,.2);
}

.password-box input::placeholder {
  color: #68758a;
}

.show-password {
  position: absolute;

  right: 14px;
  top: 50%;

  transform:
    translateY(-50%);

  border: none;

  background: transparent;

  color: #aab6c8;

  font-size: 19px;

  cursor: pointer;
}


/* LOGIN BUTTON */

.login-button {
  width: 100%;

  height: 55px;

  margin-top: 18px;

  border: none;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #dce8f8
    );

  color: #07101e;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}

#error {
  min-height: 22px;

  margin-top: 14px;

  color: #ff6677;

  font-size: 14px;
}

.security {
  margin-top: 20px;

  color: #65748a;

  font-size: 12px;
}

.created-by {
  margin-top: 12px;

  color: #718096;

  font-size: 12px;

  letter-spacing: 1px;
}

.created-by span {
  color: #4da6ff;

  font-weight: bold;
}


/* =====================================================
   DASHBOARD
===================================================== */

.dashboard {
  width: 100%;
  min-height: 100vh;

  background: #000;

  color: white;
}


/* =====================================================
   CAMERA PLAYER
===================================================== */

.camera-wrapper {

  position: relative;

  width: 100%;

  height: 78vh;

  min-height: 400px;

  background: #000;

  overflow: hidden;
}


/* CAMERA */

.camera-screen {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  background: #000;
}

.camera-placeholder {
  text-align: center;
}

.camera-icon {
  font-size: 70px;
  margin-bottom: 15px;
}

.camera-title {
  font-size: 21px;
  font-weight: bold;
}

.camera-subtitle {
  margin-top: 8px;

  color: #718096;

  font-size: 14px;
}


/* =====================================================
   FULLSCREEN BUTTON
===================================================== */

.fullscreen-button {

  position: absolute;

  right: 15px;
  bottom: 15px;

  z-index: 100;

  width: 54px;
  height: 54px;

  border-radius: 15px;

  border:
    1px solid
    rgba(255,255,255,.3);

  background:
    rgba(0,0,0,.72);

  color: white;

  font-size: 26px;

  cursor: pointer;

  touch-action: manipulation;

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);
}

.fullscreen-button:active {
  transform: scale(.92);
}


/* =====================================================
   REAL FULLSCREEN
===================================================== */

.camera-wrapper.real-fullscreen {

  position: fixed !important;

  left: 0 !important;
  top: 0 !important;

  width: 100vw !important;
  height: 100vh !important;

  min-height: 100vh !important;

  z-index: 999999 !important;

  background: #000 !important;
}


/* Camera becomes full display */

.camera-wrapper.real-fullscreen
.camera-screen {

  position: absolute;

  inset: 0;

  width: 100vw !important;
  height: 100vh !important;

  background: #000;
}


/* =====================================================
   FACE PANEL
===================================================== */

.face-panel {

  width: 100%;

  padding: 20px;

  background: #09131f;

  border-top:
    1px solid
    rgba(255,255,255,.08);
}

.face-title {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 14px;
}

.face-row {

  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 13px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,.06);

  color: #aab6c8;
}

.face-row:last-child {
  border-bottom: none;
}

.face-value {
  color: white;
  font-weight: bold;
}


/* =====================================================
   FULLSCREEN: HIDE FACE PANEL
===================================================== */

body.camera-is-fullscreen
.face-panel {
  display: none !important;
}


/* =====================================================
   LANDSCAPE
===================================================== */

@media
(orientation: landscape)
and (max-height: 600px) {

  .camera-wrapper {
    height: 100vh;
    min-height: 100vh;
  }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  .camera-wrapper {
    height: 76vh;
    min-height: 350px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<div
  id="loginPage"
  class="login-page">


  <div class="login-background">

    <div class="blue-glow"></div>

    <div class="purple-glow"></div>

    <div
      id="matrix"
      class="matrix">
    </div>

    <div class="login-grid"></div>

    <div class="login-scan"></div>

  </div>


  <div class="login-card">


    <!-- CCTV ICON -->

    <div class="cctv-icon">

      <div class="camera-body">
        <div class="camera-light"></div>
      </div>

      <div class="camera-lens"></div>

      <div class="camera-arm"></div>

      <div class="camera-base"></div>

    </div>


    <h1>
      HOME CCTV
    </h1>


    <p class="subtitle">
      Secure Security Dashboard
    </p>


    <!-- PASSWORD -->

    <div class="password-box">

      <input
        id="password"
        type="password"
        placeholder="Enter security password"
        autocomplete="off"
      >

      <button
        id="eyeButton"
        class="show-password"
        type="button">

        👁️

      </button>

    </div>


    <button
      id="loginButton"
      class="login-button"
      type="button">

      🔓 Unlock Dashboard

    </button>


    <div id="error"></div>


    <div class="security">
      🔒 HOME SECURITY SYSTEM
    </div>


    <div class="created-by">
      Created by <span>Anu</span>
    </div>


  </div>

</div>



<!-- =====================================================
     DASHBOARD
===================================================== -->

<div
  id="dashboard"
  class="dashboard hidden">


  <!-- CAMERA -->

  <div
    id="cameraWrapper"
    class="camera-wrapper">


    <div
      id="cameraScreen"
      class="camera-screen">


      <div class="camera-placeholder">

        <div class="camera-icon">
          📹
        </div>

        <div class="camera-title">
          Camera Offline
        </div>

        <div class="camera-subtitle">
          Waiting for CCTV connection...
        </div>

      </div>


    </div>


    <!-- FULLSCREEN -->

    <button
      id="fullscreenButton"
      class="fullscreen-button"
      type="button">

      ⛶

    </button>


  </div>


  <!-- FACE DETECTION -->

  <div class="face-panel">

    <div class="face-title">
      👤 Face Detection
    </div>


    <div class="face-row">

      <span>
        Face detected
      </span>

      <span
        id="faceStatus"
        class="face-value">

        No

      </span>

    </div>


    <div class="face-row">

      <span>
        Face count
      </span>

      <span
        id="faceCount"
        class="face-value">

        0

      </span>

    </div>

  </div>


</div>



<script>

/* =====================================================
   PASSWORD
===================================================== */

const PASSWORD = "ANU1234@";


/* =====================================================
   ELEMENTS
===================================================== */

const loginPage =
  document.getElementById("loginPage");

const dashboard =
  document.getElementById("dashboard");

const passwordInput =
  document.getElementById("password");

const errorMessage =
  document.getElementById("error");

const loginButton =
  document.getElementById("loginButton");

const eyeButton =
  document.getElementById("eyeButton");

const cameraWrapper =
  document.getElementById("cameraWrapper");

const fullscreenButton =
  document.getElementById("fullscreenButton");


/* =====================================================
   LOGIN
===================================================== */

function login() {

  if (
    passwordInput.value === PASSWORD
  ) {

    errorMessage.textContent = "";

    loginPage.classList.add(
      "hidden"
    );

    dashboard.classList.remove(
      "hidden"
    );

  } else {

    errorMessage.textContent =
      "❌ Incorrect password";

  }

}


loginButton.addEventListener(
  "click",
  login
);


/* ENTER KEY */

passwordInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      login();
    }

  }
);


/* =====================================================
   SHOW PASSWORD
===================================================== */

eyeButton.addEventListener(
  "click",
  function() {

    if (
      passwordInput.type === "password"
    ) {

      passwordInput.type = "text";

      eyeButton.textContent = "🙈";

    } else {

      passwordInput.type = "password";

      eyeButton.textContent = "👁️";

    }

  }
);


/* =====================================================
   MATRIX
===================================================== */

const matrix =
  document.getElementById("matrix");

for (
  let i = 0;
  i < 40;
  i++
) {

  const column =
    document.createElement("div");

  column.className =
    "matrix-column";

  column.style.left =
    Math.random() * 100 + "%";

  column.style.animationDuration =
    (4 + Math.random() * 8) + "s";

  column.style.animationDelay =
    (-Math.random() * 10) + "s";

  let numbers = "";

  for (
    let j = 0;
    j < 35;
    j++
  ) {

    numbers +=
      Math.random() > .5
      ? "1<br>"
      : "0<br>";

  }

  column.innerHTML =
    numbers;

  matrix.appendChild(
    column
  );

}


/* =====================================================
   FULLSCREEN STATE
===================================================== */

let fullscreenActive = false;


/* =====================================================
   ENTER FULLSCREEN
===================================================== */

async function enterCameraFullscreen() {

  fullscreenActive = true;

  document.body.classList.add(
    "camera-is-fullscreen"
  );

  cameraWrapper.classList.add(
    "real-fullscreen"
  );


  /*
    Try browser fullscreen.
    If Android Chrome allows it,
    the browser itself goes fullscreen.
  */

  try {

    if (
      cameraWrapper.requestFullscreen
    ) {

      await cameraWrapper.requestFullscreen();

    } else if (
      cameraWrapper.webkitRequestFullscreen
    ) {

      cameraWrapper.webkitRequestFullscreen();

    }

  } catch (error) {

    /*
      CSS fullscreen fallback
      remains active.
    */

    console.log(
      "Browser fullscreen unavailable. Using fallback."
    );

  }


  /* Try landscape orientation */

  try {

    if (
      screen.orientation &&
      screen.orientation.lock
    ) {

      await screen.orientation.lock(
        "landscape"
      );

    }

  } catch (error) {

    /*
      Android Chrome may block
      orientation lock.
    */

    console.log(
      "Landscape lock unavailable."
    );

  }


  fullscreenButton.textContent =
    "✕";

}


/* =====================================================
   EXIT FULLSCREEN
===================================================== */

async function exitCameraFullscreen() {

  fullscreenActive = false;

  document.body.classList.remove(
    "camera-is-fullscreen"
  );

  cameraWrapper.classList.remove(
    "real-fullscreen"
  );


  /* Browser fullscreen exit */

  try {

    if (
      document.fullscreenElement
    ) {

      await document.exitFullscreen();

    } else if (
      document.webkitFullscreenElement &&
      document.webkitExitFullscreen
    ) {

      document.webkitExitFullscreen();

    }

  } catch (error) {

    console.log(
      "Fullscreen exit error."
    );

  }


  /* Unlock orientation */

  try {

    if (
      screen.orientation &&
      screen.orientation.unlock
    ) {

      screen.orientation.unlock();

    }

  } catch (error) {

    console.log(
      "Orientation unlock unavailable."
    );

  }


  fullscreenButton.textContent =
    "⛶";

}


/* =====================================================
   FULLSCREEN BUTTON
===================================================== */

fullscreenButton.addEventListener(
  "click",
  async function(event) {

    event.preventDefault();

    event.stopPropagation();


    if (fullscreenActive) {

      await exitCameraFullscreen();

    } else {

      await enterCameraFullscreen();

    }

  }
);


/* =====================================================
   ESC / BACK FROM BROWSER FULLSCREEN
===================================================== */

function browserFullscreenChanged() {

  const browserFullscreen =
    document.fullscreenElement ||
    document.webkitFullscreenElement;


  /*
    If browser fullscreen ended,
    remove our CSS fallback too.
  */

  if (
    !browserFullscreen &&
    fullscreenActive
  ) {

    fullscreenActive = false;

    document.body.classList.remove(
      "camera-is-fullscreen"
    );

    cameraWrapper.classList.remove(
      "real-fullscreen"
    );

    fullscreenButton.textContent =
      "⛶";

  }

}


document.addEventListener(
  "fullscreenchange",
  browserFullscreenChanged
);

document.addEventListener(
  "webkitfullscreenchange",
  browserFullscreenChanged
);


/* =====================================================
   DOUBLE TAP CAMERA = FULLSCREEN
===================================================== */

let lastTap = 0;

cameraWrapper.addEventListener(
  "touchend",
  function(event) {

    const now =
      Date.now();

    if (
      now - lastTap < 350
    ) {

      event.preventDefault();

      if (fullscreenActive) {

        exitCameraFullscreen();

      } else {

        enterCameraFullscreen();

      }

    }

    lastTap = now;

  },
  {
    passive: false
  }
);

</script>

</body>
</html>
